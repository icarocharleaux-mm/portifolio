# Tema "dark tech" do portfolio.
#
#   #0B0F17  grafite       -> fundo da pagina
#   #131A26  grafite claro -> superficies (sidebar, inputs, cards nativos)
#   #22D3EE  ciano         -> cor de acao (botoes, links, foco)
#   #E6EDF7  quase branco  -> texto
#
# Isto cobre os componentes nativos do Streamlit. O visual proprio do
# portfolio (hero, cards, gradientes, animacoes) esta em assets/tema.css,
# e a paleta aparece uma terceira vez em utils/styles.py -> PALETA, usada
# pelos graficos. Ao trocar de cor, atualize os tres.

[theme]
base = "dark"
primaryColor = "#22D3EE"
backgroundColor = "#0B0F17"
secondaryBackgroundColor = "#131A26"
textColor = "#E6EDF7"
font = "sans serif"

[browser]
# Nao enviar estatisticas de uso.
gatherUsageStats = false

# ATENCAO: nunca versione .streamlit/secrets.toml -- ele ja esta no .gitignore.
# No Streamlit Community Cloud, segredos vao em Settings > Secrets, nao no repo.
